activity:
  name: Asphalt Paving
  id: asphalt_paving
machinery:
- Asphalt Paver
- Dump Truck
- Roller
road_layer:
  required: Asphalt
features:
- edge_density
- texture_variance
- surface_uniformity
- green_ratio
special_indicators:
- "asphalt layer"
- "roller"
- "asphalt paver"
- "surface uniformity"
- "low edge density"
inference:
  confidence_threshold: 0.4
  image_size: 640
scoring:
  machinery_weight: 3.0
  road_layer_weight: 3.0
  feature_weight: 1.0
  special_weight: 1.0
  detection_threshold: 0.35
  feature_normalization:
    edge_density_max: 0.3
    texture_variance_max: 5000.0
output:
  save_results: true
